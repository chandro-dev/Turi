name: turi

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: turi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-turi_dev_password}
      POSTGRES_DB: turi
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turi -d turi"]
      interval: 5s
      timeout: 3s
      retries: 20

  suggestion-service:
    build: ./suggestion-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://turi:${POSTGRES_PASSWORD:-turi_dev_password}@db:5432/turi_suggest
      ESTIMATOR: ${ESTIMATOR:-hybrid}   # ema | hybrid (EMA + scikit-learn)
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  turnos-api:
    build: ./turnos-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://turi:${POSTGRES_PASSWORD:-turi_dev_password}@db:5432/turi
      SUGGEST_URL: http://suggestion-service:8001
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      SEED_DEMO: ${SEED_DEMO:-true}
      BOOTSTRAP_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      PRIORITY_TARGET_WAIT_MIN: ${PRIORITY_TARGET_WAIT_MIN:-10}
      PRIORITY_BASE_BONUS_MIN: ${PRIORITY_BASE_BONUS_MIN:-20}
      PRIORITY_MAX_BONUS_MIN: ${PRIORITY_MAX_BONUS_MIN:-60}
      APP_TZ: America/Bogota
    depends_on:
      db:
        condition: service_healthy
      suggestion-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Nombre unico (no 'web'): evita colisiones de alias DNS si se une a redes compartidas (p. ej. Caddy del servidor).
  turi-web:
    build: ./web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      turnos-api:
        condition: service_healthy

volumes:
  pgdata:
